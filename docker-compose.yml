x-catcher-base: &catcher-base
  build:
    context: .
  image: obs-chat-bot:dev
  env_file:
    - .env
  environment:
    APP_DEBUG: ${APP_DEBUG:-false}
  volumes:
    - ./data:/app/data
  healthcheck:
    test: ["CMD", "python", "-m", "obs_chat_bot", "--healthcheck"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 5s

services:
  tg_catcher:
    <<: *catcher-base
    command: ["python", "-m", "obs_chat_bot", "--telegram-bot"]

  vk_catcher:
    <<: *catcher-base
    command: ["python", "-m", "obs_chat_bot", "--vk-bot"]
